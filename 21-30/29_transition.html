<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition dalam CSS</title>
    <link rel="stylesheet" href="../css/style_29.css">
</head>

<body>

    <h1>Eksperimen CSS Transition</h1>
    <p class="subtitle">Arahkan kursor pada elemen di bawah untuk melihat keajaiban transition</p>

    <div class="demo-container">
        <!-- Contoh 1: Transisi Warna & Ukuran Tombol -->
        <div class="card-demo">
            <h3>1. Animasi Tombol (Ease)</h3>
            <button class="btn-modern">Sentuh Saya</button>
        </div>

        <!-- Contoh 2: Efek Membal Kustom -->
        <div class="card-demo">
            <h3>2. Efek Membal (Cubic-Bezier)</h3>
            <div class="circle-bounce"></div>
        </div>

        <!-- Contoh 3: Transisi Beruntun dengan Delay -->
        <div class="card-demo">
            <h3>3. Transisi Bertahap (Delay)</h3>
            <div class="box-delay">
                <span class="text-hidden">Halo! 👋</span>
            </div>
        </div>
    </div>

</body>

</html>
