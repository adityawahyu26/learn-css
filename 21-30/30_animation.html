<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation dalam CSS</title>
    <link rel="stylesheet" href="../css/style_30.css">
</head>

<body>

    <h1>Eksperimen CSS Animation</h1>
    <p class="subtitle">Animasi di bawah ini berjalan otomatis tanpa perlu menyentuh kursor!</p>

    <div class="animation-container">
        <!-- Contoh 1: Objek Melayang (Efek Hero Image di Website Modern) -->
        <div class="card-anim">
            <h3>1. Efek Melayang (Floating)</h3>
            <div class="avatar-float">🚀</div>
        </div>

        <!-- Contoh 2: Loading Spinner (Berputar Selamanya) -->
        <div class="card-anim">
            <h3>2. Loading Spinner</h3>
            <div class="spinner-load"></div>
        </div>

        <!-- Contoh 3: Efek Teks Mengetik (Typing Effect) -->
        <div class="card-anim">
            <h3>3. Efek Mengetik</h3>
            <div class="typing-container">
                <p class="typing-text">Sedang memuat data...</p>
            </div>
        </div>
    </div>

</body>

</html>
