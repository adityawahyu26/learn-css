<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Style Type Awesome</title>
    <link rel="stylesheet" href="../css/style_43.css">
    <link rel="stylesheet" href="../awesome/css/all.css">
</head>

<body>
    <ul class="fa-ul">
        <li>
            <span class="fa-li">
                <i class="fas fa-circle-check"></i>
            </span> item 1
        </li>
        <li>
            <span class="fa-li">
                <i class="fas fa-check-square"></i>
            </span> item 2
        </li>
        <li>
            <span class="fa-li">
                <i class="fas fa-arrow-right"></i>
            </span> item 3
        </li>
    </ul>
</body>

</html>
